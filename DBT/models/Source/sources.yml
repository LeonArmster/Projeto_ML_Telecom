version: 2

sources:
  - name: telecom
    description: >
      Fonte operacional contendo os dados das ordens de serviço utilizadas
      no processo de análise de efetividade.

    database: TELECOM
    schema: DBO

    tables:

      # ============================================================
      # TABELA OPERACIONAL
      # ============================================================

      - name: tb_efetividade
        identifier: Tb_Efetividade
        description: >
          Tabela operacional com informações das ordens de serviço,
          agendamento, técnico responsável e resultado da execução.

        columns:

          - name: PON
            description: "Número identificador da ordem de serviço."

          - name: Atividade
            description: "Número identificador da atividade dentro do dia."

          - name: TP_Atividade
            description: "Tipo da atividade ou serviço."

          - name: Intervalo
            description: "Slot de horário agendado para execução da ordem."

          - name: Status
            description: "Status atual da ordem."

          - name: Detalhe_Atividade
            description: "Detalhamento da atividade associada à ordem."

          - name: Rede_Acesso
            description: "Tipo de rede de acesso utilizada na ordem."

          - name: Status_Final
            description: "Status final obtido após o processamento da ordem."

          - name: Grupo_Info
            description: "Agrupamento do status final da ordem."

          - name: Tipo_Servico
            description: >
              Classificação do tipo de serviço, incluindo categorias como
              alta, reparo, mudança de endereço, migração e serviço.

          - name: CARGA_CONF
            description: "Campo atualmente não utilizado no processo analítico."

          - name: MATRICULA_CONF
            description: "Campo atualmente não utilizado no processo analítico."

          - name: DIA_ATUAL
            description: "Campo atualmente não utilizado no processo analítico."

          - name: INICIO_SLOT
            description: "Horário de início do slot agendado."

          - name: FIM_SLOT
            description: "Horário de término do slot agendado."

          - name: CHEGADA_SLOT
            description: "Indicador relacionado à chegada do técnico dentro do horário do slot."

          - name: NUMERO_ORDEM
            description: "Campo atualmente não utilizado no processo analítico."

          - name: CANAL
            description: "Campo atualmente não utilizado no processo analítico."

          - name: DIV_GER_CIDADE
            description: "Campo atualmente não utilizado no processo analítico."

          - name: DEALER
            description: "Campo atualmente não utilizado no processo analítico."

          - name: LOGIN
            description: "Campo atualmente não utilizado no processo analítico."

          - name: NOME_LOGIN
            description: "Campo atualmente não utilizado no processo analítico."

          - name: DT_ABERTURA
            description: "Campo atualmente não utilizado no processo analítico."

          - name: BASE
            description: "Campo atualmente não utilizado no processo analítico."

          - name: CANALNIVEL1
            description: "Campo atualmente não utilizado no processo analítico."

          - name: Cidade
            description: "Cidade associada à ordem de serviço."

          - name: DT_Ag_Execucao
            description: "Data prevista para execução da ordem."

          - name: Segmento
            description: "Segmento associado à ordem ou cliente."

          - name: Categoria_Cliente
            description: "Categoria do cliente associado à ordem."

          - name: Duracao
            description: "Duração registrada para a atividade."

          - name: MACRO_PRODUTO
            description: "Classificação do macroproduto relacionado à ordem."

          - name: GERENCIA
            description: "Gerência responsável pela região ou operação da ordem."

          - name: CLUSTER_ZEUS
            description: "Cluster operacional associado à ordem."

          - name: ORIGEM_ORDENS
            description: "Origem ou sistema responsável pela geração da ordem."

          - name: Inicio_Previsto
            description: "Horário previsto para início da atividade."

          - name: Inicio_Real
            description: "Horário real registrado para início da atividade."

          - name: Matricula_Oper
            description: "Matrícula do operador associada ao registro."

          - name: Nome_Oper
            description: "Nome do operador associado ao registro."


      # ============================================================
      # STAGING DO MODELO DE EFETIVIDADE
      # ============================================================

      - name: tb_stg_ml_predicoes_efetividade
        identifier: tb_stg_ml_predicoes_efetividade

        description: >
          Tabela de staging contendo os dados preparados pelo processo
          de machine learning para geração e armazenamento das predições
          de efetividade das ordens.

        columns:

          # --------------------------------------------------------
          # IDENTIFICAÇÃO
          # --------------------------------------------------------

          - name: ordem_id
            description: "Identificador da ordem de serviço."

          - name: atividade_id
            description: "Identificador da atividade da ordem."

          # --------------------------------------------------------
          # CARACTERÍSTICAS DA ORDEM
          # --------------------------------------------------------

          - name: tipo_atividade
            description: "Tipo da atividade."

          - name: slot
            description: "Slot de horário da ordem."

          - name: status_ordem
            description: "Status da ordem."

          - name: detalhe_atividade
            description: "Detalhamento da atividade."

          - name: tipo_servico
            description: "Tipo de serviço."

          - name: cidade
            description: "Cidade da ordem."

          - name: data_agendamento
            description: "Data de agendamento da ordem."

          - name: segmento
            description: "Segmento da ordem."

          - name: categoria_cliente
            description: "Categoria do cliente."

          - name: duracao
            description: "Duração da atividade."

          - name: rede_acesso
            description: "Rede de acesso."

          - name: nome_operador
            description: "Nome do técnico responsável pela ordem."

          - name: cluster_zeus
            description: "Cluster Zeus associado à ordem."

          - name: gerencia
            description: "Gerência responsável pela ordem."

          # --------------------------------------------------------
          # RESULTADO
          # --------------------------------------------------------

          - name: efetividade
            description: >
              Resultado real da ordem.
              1 representa uma ordem efetiva e 0 uma ordem não efetiva.

          # --------------------------------------------------------
          # VARIÁVEIS TEMPORAIS
          # --------------------------------------------------------

          - name: ano
            description: "Ano da data de agendamento."

          - name: mes
            description: "Mês da data de agendamento."

          - name: dia
            description: "Dia do mês da data de agendamento."

          - name: dia_semana
            description: "Dia da semana da data de agendamento."

          - name: semana_ano
            description: "Semana do ano da data de agendamento."

          - name: fim_de_semana
            description: "Indicador de final de semana."

          # --------------------------------------------------------
          # TÉCNICO
          # --------------------------------------------------------

          - name: qtd_ordens_7D_tecnico
            description: "Quantidade de ordens do técnico nos últimos 7 dias."

          - name: qtd_efetivas_7D_tecnico
            description: "Quantidade de ordens efetivas do técnico nos últimos 7 dias."

          - name: efetividade_tecnico_7D
            description: "Taxa de efetividade do técnico nos últimos 7 dias."

          - name: qtd_ordens_15D_tecnico
            description: "Quantidade de ordens do técnico nos últimos 15 dias."

          - name: qtd_efetivas_15D_tecnico
            description: "Quantidade de ordens efetivas do técnico nos últimos 15 dias."

          - name: efetividade_tecnico_15D
            description: "Taxa de efetividade do técnico nos últimos 15 dias."

          - name: qtd_ordens_30D_tecnico
            description: "Quantidade de ordens do técnico nos últimos 30 dias."

          - name: qtd_efetivas_30D_tecnico
            description: "Quantidade de ordens efetivas do técnico nos últimos 30 dias."

          - name: efetividade_tecnico_30D
            description: "Taxa de efetividade do técnico nos últimos 30 dias."

          # --------------------------------------------------------
          # TIPO DE SERVIÇO
          # --------------------------------------------------------

          - name: qtd_ordens_7D_tipo_servico
            description: "Quantidade de ordens do tipo de serviço nos últimos 7 dias."

          - name: qtd_efetivas_7D_tipo_servico
            description: "Quantidade de ordens efetivas do tipo de serviço nos últimos 7 dias."

          - name: efetividade_tipo_servico_7D
            description: "Taxa de efetividade do tipo de serviço nos últimos 7 dias."

          - name: qtd_ordens_15D_tipo_servico
            description: "Quantidade de ordens do tipo de serviço nos últimos 15 dias."

          - name: qtd_efetivas_15D_tipo_servico
            description: "Quantidade de ordens efetivas do tipo de serviço nos últimos 15 dias."

          - name: efetividade_tipo_servico_15D
            description: "Taxa de efetividade do tipo de serviço nos últimos 15 dias."

          - name: qtd_ordens_30D_tipo_servico
            description: "Quantidade de ordens do tipo de serviço nos últimos 30 dias."

          - name: qtd_efetivas_30D_tipo_servico
            description: "Quantidade de ordens efetivas do tipo de serviço nos últimos 30 dias."

          - name: efetividade_tipo_servico_30D
            description: "Taxa de efetividade do tipo de serviço nos últimos 30 dias."

          # --------------------------------------------------------
          # ATIVIDADE + SLOT
          # --------------------------------------------------------

          - name: qtd_ordens_7D_atividade_slot
            description: "Quantidade de ordens da atividade e slot nos últimos 7 dias."

          - name: qtd_efetivas_7D_atividade_slot
            description: "Quantidade de ordens efetivas da atividade e slot nos últimos 7 dias."

          - name: efetividade_atividade_slot_7D
            description: "Taxa de efetividade da atividade e slot nos últimos 7 dias."

          - name: qtd_ordens_15D_atividade_slot
            description: "Quantidade de ordens da atividade e slot nos últimos 15 dias."

          - name: qtd_efetivas_15D_atividade_slot
            description: "Quantidade de ordens efetivas da atividade e slot nos últimos 15 dias."

          - name: efetividade_atividade_slot_15D
            description: "Taxa de efetividade da atividade e slot nos últimos 15 dias."

          - name: qtd_ordens_30D_atividade_slot
            description: "Quantidade de ordens da atividade e slot nos últimos 30 dias."

          - name: qtd_efetivas_30D_atividade_slot
            description: "Quantidade de ordens efetivas da atividade e slot nos últimos 30 dias."

          - name: efetividade_atividade_slot_30D
            description: "Taxa de efetividade da atividade e slot nos últimos 30 dias."

          # --------------------------------------------------------
          # TÉCNICO + ATIVIDADE
          # --------------------------------------------------------

          - name: qtd_ordens_7D_tecnico_atividade
            description: "Quantidade de ordens do técnico e atividade nos últimos 7 dias."

          - name: qtd_efetivas_7D_tecnico_atividade
            description: "Quantidade de ordens efetivas do técnico e atividade nos últimos 7 dias."

          - name: efetividade_tecnico_atividade_7D
            description: "Taxa de efetividade do técnico e atividade nos últimos 7 dias."

          - name: qtd_ordens_15D_tecnico_atividade
            description: "Quantidade de ordens do técnico e atividade nos últimos 15 dias."

          - name: qtd_efetivas_15D_tecnico_atividade
            description: "Quantidade de ordens efetivas do técnico e atividade nos últimos 15 dias."

          - name: efetividade_tecnico_atividade_15D
            description: "Taxa de efetividade do técnico e atividade nos últimos 15 dias."

          - name: qtd_ordens_30D_tecnico_atividade
            description: "Quantidade de ordens do técnico e atividade nos últimos 30 dias."

          - name: qtd_efetivas_30D_tecnico_atividade
            description: "Quantidade de ordens efetivas do técnico e atividade nos últimos 30 dias."

          - name: efetividade_tecnico_atividade_30D
            description: "Taxa de efetividade do técnico e atividade nos últimos 30 dias."

          # --------------------------------------------------------
          # TÉCNICO + SEGMENTO
          # --------------------------------------------------------

          - name: qtd_ordens_7D_tecnico_segmento
            description: "Quantidade de ordens do técnico e segmento nos últimos 7 dias."

          - name: qtd_efetivas_7D_tecnico_segmento
            description: "Quantidade de ordens efetivas do técnico e segmento nos últimos 7 dias."

          - name: efetividade_tecnico_segmento_7D
            description: "Taxa de efetividade do técnico e segmento nos últimos 7 dias."

          - name: qtd_ordens_15D_tecnico_segmento
            description: "Quantidade de ordens do técnico e segmento nos últimos 15 dias."

          - name: qtd_efetivas_15D_tecnico_segmento
            description: "Quantidade de ordens efetivas do técnico e segmento nos últimos 15 dias."

          - name: efetividade_tecnico_segmento_15D
            description: "Taxa de efetividade do técnico e segmento nos últimos 15 dias."

          - name: qtd_ordens_30D_tecnico_segmento
            description: "Quantidade de ordens do técnico e segmento nos últimos 30 dias."

          - name: qtd_efetivas_30D_tecnico_segmento
            description: "Quantidade de ordens efetivas do técnico e segmento nos últimos 30 dias."

          - name: efetividade_tecnico_segmento_30D
            description: "Taxa de efetividade do técnico e segmento nos últimos 30 dias."

          # --------------------------------------------------------
          # CIDADE + ATIVIDADE
          # --------------------------------------------------------

          - name: qtd_ordens_7D_cidade_atividade
            description: "Quantidade de ordens da cidade e atividade nos últimos 7 dias."

          - name: qtd_efetivas_7D_cidade_atividade
            description: "Quantidade de ordens efetivas da cidade e atividade nos últimos 7 dias."

          - name: efetividade_cidade_atividade_7D
            description: "Taxa de efetividade da cidade e atividade nos últimos 7 dias."

          - name: qtd_ordens_15D_cidade_atividade
            description: "Quantidade de ordens da cidade e atividade nos últimos 15 dias."

          - name: qtd_efetivas_15D_cidade_atividade
            description: "Quantidade de ordens efetivas da cidade e atividade nos últimos 15 dias."

          - name: efetividade_cidade_atividade_15D
            description: "Taxa de efetividade da cidade e atividade nos últimos 15 dias."

          - name: qtd_ordens_30D_cidade_atividade
            description: "Quantidade de ordens da cidade e atividade nos últimos 30 dias."

          - name: qtd_efetivas_30D_cidade_atividade
            description: "Quantidade de ordens efetivas da cidade e atividade nos últimos 30 dias."

          - name: efetividade_cidade_atividade_30D
            description: "Taxa de efetividade da cidade e atividade nos últimos 30 dias."

          # --------------------------------------------------------
          # PREDIÇÃO
          # --------------------------------------------------------

          - name: probabilidade
            description: >
              Probabilidade de efetividade calculada pelo modelo de
              machine learning para a ordem.