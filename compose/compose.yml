name: telecom_data_science

services:

    sqlserver:

      image: mcr.microsoft.com/mssql/server:2022-latest

      container_name: telecom_data_science_sql_server

      environment:
        ACCEPT_EULA: ${ACCEPT_EULA}
        MSSQL_SA_PASSWORD: ${DB_PASSWORD}

      ports:
        - "1433:1433"

      volumes:
        - sqlserver_data:/var/opt/mssql
        - ../Data:/Data
        - ../SQL:/SQL

      healthcheck:
        test:
          [
            "CMD-SHELL",
            "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P $$MSSQL_SA_PASSWORD -Q \"SELECT 1\" || exit 1"
          ]
        interval: 10s
        timeout: 5s
        retries: 10
        start_period: 30s




volumes:

  sqlserver_data: